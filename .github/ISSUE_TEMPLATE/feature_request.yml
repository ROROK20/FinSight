name: Feature Request
description: Suggest an idea or enhancement for FinSight
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe the problem you
        are trying to solve, not just the solution — it helps us find the best
        design.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this feature solve? What can't you do today?
      placeholder: As an analyst, I want to ... so that I can ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature or change you'd like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've thought about.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of FinSight does this touch?
      options:
        - Ingestion (SEC EDGAR / transcripts / market data)
        - Extraction (KPIs / XBRL / LLM)
        - Models (DCF / comps)
        - Sentiment
        - Report generation
        - REST API
        - Frontend
        - Docs / tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, references, or anything else helpful.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I would be willing to help implement this.
          required: false

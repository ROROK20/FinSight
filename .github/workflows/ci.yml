name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tests/test_docs.py orders og.png and the screenshot by history
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]" && pip install beautifulsoup4
      - name: Test
        run: pytest tests/ --cov=finsight --cov-report=xml -v
      - uses: codecov/codecov-action@v4
        with:
          file: coverage.xml

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint / typecheck
        run: npm run lint --if-present
      - name: Unit tests (node:test, no extra dependency)
        run: npm test
      - name: Build
        run: npm run build
      - name: Prerendered HTML carries no localhost, and the build no invented figure
        # Built with no NEXT_PUBLIC_* set, as a careless deploy would be. Each check
        # is an `if`: under `bash -e` a `! grep` on a non-final line cannot fail the
        # step (tests/test_frontend_truth.py runs this block). The patterns are
        # placeholder figures that must never reach a deployed page.
        run: |
          if grep -q localhost .next/server/app/index.html; then
            echo "localhost in the prerendered page"; exit 1
          fi
          if grep -rqE '195\.42|412\.18|118\.13|165\.84|218\.93|383285|modelValue:220|Sample peer' \
            .next/server/app/index.html .next/static; then
            echo "an invented figure in the build"; exit 1
          fi
